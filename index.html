<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenAI Study & Placement Assistant — Module 06 Capstone</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #0f172a; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 820px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .header { background: linear-gradient(135deg, #1e293b, #2563eb); color: #fff; padding: 18px 22px; }
    .header h1 { margin: 0 0 4px; font-size: 1.25rem; }
    .header p { margin: 0; font-size: 0.85rem; opacity: 0.9; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 18px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .controls input, .controls select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; }
    .rag-box { padding: 12px 18px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
    .rag-box label { font-size: 0.8rem; font-weight: 700; color: #334155; display: block; margin-bottom: 5px; }
    .chat { height: 340px; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .bot { align-self: flex-start; background: #e2e8f0; color: #0f172a; }
    .trace { font-size: 0.75rem; color: #475569; background: #f8fafc; border-left: 3px solid #2563eb; padding: 6px 10px; border-radius: 4px; }
    .footer { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid #e2e8f0; }
    .footer input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    button { background: #2563eb; color: #fff; border: none; padding: 0 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .secondary { background: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>GenAI Study & Placement Assistant (Capstone)</h1>
      <p>Integrates Prompt Engineering • LLM API • RAG Document Q&A • Agent Tool Calling</p>
    </div>

    <div class="controls">
      <input type="password" id="apiKey" placeholder="Optional: Gemini API Key (blank = Smart Local Mode)" />
      <select id="promptRole">
        <option value="Study & Interview Coach: Answer concisely with structured bullet points.">Prompt Role: Interview & Study Coach</option>
        <option value="Technical Summarizer: Summarize strictly from context without assumptions.">Prompt Role: Strict RAG Summarizer</option>
        <option value="Resume & Career Advisor: Give actionable placement preparation tips.">Prompt Role: Placement Advisor</option>
      </select>
    </div>

    <div class="rag-box">
      <label for="knowledgeBase">RAG Knowledge Base (Edit or paste study/placement notes below):</label>
      <textarea id="knowledgeBase" rows="3">RAG retrieves relevant document chunks via similarity search before generating an answer to reduce hallucinations. AI Agents use a loop: Understand Task -> Decide Action -> Use Tool -> Process Result -> Respond. Good ATS resumes quantify project impact using action verbs and clear architecture.</textarea>
    </div>

    <div class="chat" id="chatBox">
      <div class="trace">Agent Ready • Try asking: "What is RAG?", "Calculate 85 * 1.2", or "Checklist for my interview"</div>
    </div>

    <div class="footer">
      <input type="text" id="userInput" placeholder="Ask from your notes, run a calculation, or ask an interview question..." onkeydown="if(event.key==='Enter') runAgent()" />
      <button onclick="runAgent()">Send</button>
      <button class="secondary" onclick="resetChat()">Clear</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    let history = [];

    function addBubble(cls, text) {
      const div = document.createElement("div");
      div.className = cls === "trace" ? "trace" : `msg ${cls}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function resetChat() {
      history = [];
      chatBox.innerHTML = '<div class="trace">Session reset • Memory cleared</div>';
    }

    // 1. RAG Retrieval (Chunking + Keyword/Cosine-style Overlap)
    function retrieveContext(query, kbText) {
      const chunks = kbText.split(/[.!?]\s+/).filter(Boolean);
      const qWords = new Set(query.toLowerCase().match(/[a-z0-9]+/g) || []);
      let bestChunk = "";
      let bestScore = 0;

      for (const chunk of chunks) {
        const cWords = chunk.toLowerCase().match(/[a-z0-9]+/g) || [];
        const overlap = cWords.filter(w => qWords.has(w) && w.length > 2).length;
        if (overlap > bestScore) {
          bestScore = overlap;
          bestChunk = chunk;
        }
      }
      return bestScore > 0 ? bestChunk : "";
    }

    // 2. Agent Tool Router
    function decideTool(query) {
      const lower = query.toLowerCase();
      const mathMatch = lower.match(/([0-9+\-*/().\s]{3,})/);
      if ((lower.includes("calc") || lower.includes("solve") || /[0-9]\s*[+\-*/]\s*[0-9]/.test(lower)) && mathMatch) {
        try {
          const expr = mathMatch[1].trim();
          const val = Function(`"use strict"; return (${expr})`)();
          if (typeof val === "number" && !Number.isNaN(val)) {
            return { tool: "CalculatorTool", result: `${expr} = ${val}` };
          }
        } catch (_) {}
      }
      if (lower.includes("checklist") || lower.includes("plan")) {
        return {
          tool: "StudyPlannerTool",
          result: "1) Review core concepts  2) Practice 2 coding/RAG questions  3) Verify GitHub & live demo links"
        };
      }
      return { tool: "RAG_SearchTool", result: null };
    }

    // 3. Main Agent Execution Loop
    async function runAgent() {
      const input = document.getElementById("userInput");
      const query = input.value.trim();
      if (!query) return;

      const apiKey = document.getElementById("apiKey").value.trim();
      const rolePrompt = document.getElementById("promptRole").value;
      const kbText = document.getElementById("knowledgeBase").value;

      input.value = "";
      addBubble("user", query);
      history.push({ role: "user", parts: [{ text: query }] });

      // Decide Tool & Retrieve RAG Context
      const action = decideTool(query);
      const ragHit = retrieveContext(query, kbText);
      addBubble("trace", `Agent Step -> Tool Selected: ${action.tool} | RAG Match: ${ragHit ? "Yes" : "None"}`);

      if (action.tool !== "RAG_SearchTool" && action.result) {
        const toolReply = `[${action.tool} Output]\n${action.result}`;
        history.push({ role: "model", parts: [{ text: toolReply }] });
        addBubble("bot", toolReply);
        return;
      }

      if (!apiKey) {
        const localReply = ragHit
          ? `[Grounded RAG + Prompt Role Response]\nRole: ${rolePrompt}\n\nBased on your Knowledge Base: "${ragHit}."\n\n(Tip: Add a Gemini API key above for open-ended LLM generation.)`
          : `[Prompt Role Response]\nRole: ${rolePrompt}\n\nNo direct match found in the RAG Knowledge Base for "${query}". Add relevant notes above or paste a Gemini API key for full LLM answers.`;
        history.push({ role: "model", parts: [{ text: localReply }] });
        addBubble("bot", localReply);
        return;
      }

      try {
        const augmentedPrompt = ragHit
          ? `Retrieved Knowledge Base Context: "${ragHit}"\n\nUser Question: ${query}`
          : query;

        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: rolePrompt }] },
              contents: [...history.slice(-5, -1), { role: "user", parts: [{ text: augmentedPrompt }] }]
            })
          }
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "API Error");
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
        history.push({ role: "model", parts: [{ text: reply }] });
        addBubble("bot", reply);
      } catch (err) {
        addBubble("bot", `Error: ${err.message}`);
      }
    }
  </script>
</body>
</html>
